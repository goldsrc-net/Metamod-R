name: C/C++ CI

on:
  push:
    branches: [master, 64bit]
    paths-ignore:
      - '**.md'
      - '.github/**'

  pull_request:
    types: [opened, reopened, synchronize]
  release:
    types: [published]
  workflow_dispatch:

jobs:
  windows:
    name: 'Windows'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: Win32
            artifact: win32
            outname: metamod_i386
          - arch: x64
            artifact: win64
            outname: metamod_amd64
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      # appversion.h is generated by metamod/version/appversion.sh
      # (bash). On windows-latest, bash is available via Git for Windows.
      # The script reads $SOURCE_DIR/metamod/version/version.h and writes
      # appversion.h next to it, so SOURCE_DIR must be the repo root.
      - name: Generate appversion.h
        shell: bash
        run: ./metamod/version/appversion.sh "${PWD}"

      - name: Configure (${{ matrix.arch }})
        run: cmake -B build-${{ matrix.artifact }} -A ${{ matrix.arch }}

      - name: Build (${{ matrix.arch }})
        run: cmake --build build-${{ matrix.artifact }} --config Release -j 2

      - name: Stage artifacts
        shell: bash
        run: |
          mkdir -p publish/addons/metamod publish/debug
          cp build-${{ matrix.artifact }}/metamod/Release/${{ matrix.outname }}.dll \
             publish/addons/metamod/${{ matrix.outname }}.dll
          # PDB is optional but useful for debugging.
          if [ -f build-${{ matrix.artifact }}/metamod/Release/${{ matrix.outname }}.pdb ]; then
            cp build-${{ matrix.artifact }}/metamod/Release/${{ matrix.outname }}.pdb \
               publish/debug/${{ matrix.outname }}.pdb
          fi

      - name: Deploy artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: publish/*

  linux:
    name: 'Linux'
    runs-on: ubuntu-latest
    container: debian:11-slim

    steps:
      # Install git + cmake (and the rest) BEFORE checkout — without git
      # the action falls back to the REST-API download path which can't
      # honour `submodules: recursive`, and debian:11's stock cmake 3.18
      # is below AsmJit's minimum (3.24). pip3's cmake wheel is the
      # smallest way to get a current cmake on this image.
      - name: Install dependencies
        run: |
          dpkg --add-architecture i386
          apt-get update
          apt-get install -y \
            gcc-multilib g++-multilib \
            build-essential \
            libc6-dev libc6-dev-i386 \
            git rsync python3-pip ca-certificates \
            g++ gcc
          pip3 install --break-system-packages 'cmake>=3.24'

      - name: Configure
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive


      - name: GPG Import
        run: |
          echo "${{ secrets.PUB_ASC }}" > "${{ secrets.PUB_ASC_FILE }}"
          echo "${{ secrets.KEY_ASC }}" > "${{ secrets.KEY_ASC_FILE }}"

          # Import the public key
          gpg --batch --yes --import "${{ secrets.PUB_ASC_FILE }}"
          if [[ $? -ne 0 ]]; then
            echo "Error: Failed to import the public key"
            exit 1
          fi

          # Import the private key
          gpg --batch --yes --import "${{ secrets.KEY_ASC_FILE }}"
          if [[ $? -ne 0 ]]; then
            echo "Error: Failed to import the private key"
            exit 2
          fi

          # Extract the fingerprint of the imported public key
          GPG_LINUX_FINGERPRINT=$(gpg --list-keys --with-colons | grep '^fpr' | head -n 1 | cut -d: -f10)

          # Check if the fingerprint was extracted
          if [[ -z "$GPG_LINUX_FINGERPRINT" ]]; then
            echo "Error: Failed to extract the fingerprint of the key"
            exit 3
          fi

          # Set the trust level for the key
          echo "$GPG_LINUX_FINGERPRINT:6:" | gpg --batch --import-ownertrust
          if [ $? -ne 0 ]; then
            echo "Error: Failed to set trust for the key $GPG_LINUX_FINGERPRINT"
            exit 4
          fi

          echo "Key $GPG_LINUX_FINGERPRINT successfully imported and trusted"
          gpg --list-keys

          #export for global use
          echo "GPG_LINUX_FINGERPRINT=$GPG_LINUX_FINGERPRINT" >> $GITHUB_ENV
        shell: bash
        if: github.event_name != 'pull_request'

      - name: Build using Intel GCC Compiler
        run: |
          rm -rf build && cmake -DCMAKE_BUILD_TYPE=COMPAT_GLIBC -B build && cmake --build build -j8

      - name: Prepare SDK
        run: |
          mkdir -p publish/sdk
          mkdir -p publish/addons/metamod
          rsync -a \
            --include=dllapi.h \
            --include=engine_api.h \
            --include=enginecallbacks.h \
            --include=h_export.h \
            --include=meta_api.h \
            --include=mutil.h \
            --include=plinfo.h \
            --exclude='*' metamod/src/ publish/sdk
          rsync metamod/extra/config.ini publish/addons/metamod
          rsync metamod/extra/plugins.ini publish/addons/metamod
          rsync -a metamod/extra/example/ publish/example_plugin
          rsync -a publish/sdk/ publish/example_plugin/include/metamod

      - name: Move files
        run: |
          mv build/metamod/metamod_i386.so publish/addons/metamod/metamod_i386.so
          mv metamod/version/appversion.h publish/appversion.h

      - name: Run GLIBC/ABI version compat test
        run: |
          binaries=(
            "publish/addons/metamod/metamod_i386.so"
          )
          bash ./metamod/version/glibc_test.sh ${binaries[@]}
          if [[ $? -ne 0 ]]; then
            exit 1 # Assertion failed
          fi
        shell: bash

      - name: Deploy artifacts
        uses: actions/upload-artifact@v4
        id: upload-job
        with:
          name: linux32
          path: publish/*

  linux-amd64:
    name: 'Linux amd64'
    runs-on: ubuntu-24.04
    container: debian:11-slim

    steps:
      - name: Install dependencies
        # debian:11 stock cmake (3.18) is below AsmJit's required 3.24;
        # pull a current cmake from pip alongside the rest. Same approach
        # used by the Linux (i386) job above.
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential git rsync ca-certificates python3-pip \
            g++ gcc
          pip3 install --break-system-packages 'cmake>=3.24'

      - name: Configure
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Build (amd64)
        run: |
          rm -rf build64
          cmake -B build64 -DBUILD_64BIT=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build64 -j$(nproc)

      - name: Move files
        run: |
          mkdir -p publish/addons/metamod
          mv build64/metamod/metamod_amd64.so publish/addons/metamod/metamod_amd64.so

      - name: Deploy artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux64
          path: publish/*

  linux-aarch64:
    name: 'Linux aarch64'
    # GitHub provides free ubuntu-24.04-arm runners for public repos. Native
    # aarch64 build avoids QEMU and the glibc-version-locking dance the
    # workstation cross-build needed.
    runs-on: ubuntu-24.04-arm
    container: debian:12-slim

    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential cmake git rsync ca-certificates \
            g++ gcc

      - name: Configure
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Build (aarch64)
        run: |
          rm -rf build_aarch64
          # Native arm64 build; CMakeLists auto-detects via CMAKE_SYSTEM_PROCESSOR,
          # no -DBUILD_64BIT needed.
          cmake -B build_aarch64 -DCMAKE_BUILD_TYPE=Release
          cmake --build build_aarch64 -j$(nproc)

      - name: Move files
        run: |
          mkdir -p publish/addons/metamod
          mv build_aarch64/metamod/metamod_aarch64.so publish/addons/metamod/metamod_aarch64.so

      - name: Deploy artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linuxarm64
          path: publish/*

  publish:
    name: 'Publish'
    runs-on: ubuntu-latest
    needs: [windows, linux, linux-amd64, linux-aarch64]

    steps:
      - name: Deploying linux i386 artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux32

      - name: Deploying linux amd64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux64

      - name: Deploying linux arm64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: linuxarm64

      - name: Deploying windows Win32 artifacts
        uses: actions/download-artifact@v4
        with:
          name: win32

      - name: Deploying windows Win64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: win64

      - name: Reading appversion.h
        run: |
          if [ -e appversion.h ]; then
            APP_VERSION=$(cat appversion.h | grep -wi '#define APP_VERSION_STRD' | sed -e 's/#define APP_VERSION_STRD[ \t\r\n\v\f]\+\(.*\)/\1/i' -e 's/\r//g')
            if [ $? -ne 0 ]; then
              APP_VERSION=""
            else
              # Remove quotes
              APP_VERSION=$(echo $APP_VERSION | xargs)
              echo "APP_VERSION=${APP_VERSION}" >> $GITHUB_ENV
            fi
          fi
          rm -f appversion.h

      - name: Packaging binaries
        id: packaging-job
        if: |
          github.event_name == 'release' &&
          github.event.action == 'published' &&
          startsWith(github.ref, 'refs/tags/')
        run: |

          # new runner, niw signs
          echo "${{ secrets.PUB_ASC }}" > "${{ secrets.PUB_ASC_FILE }}"
          echo "${{ secrets.KEY_ASC }}" > "${{ secrets.KEY_ASC_FILE }}"
          gpg --batch --yes --import "${{ secrets.PUB_ASC_FILE }}"
          gpg --batch --yes --import "${{ secrets.KEY_ASC_FILE }}"
          GPG_LINUX_FINGERPRINT=$(gpg --list-keys --with-colons | grep '^fpr' | head -n 1 | cut -d: -f10)
          echo "$GPG_LINUX_FINGERPRINT:6:" | gpg --batch --import-ownertrust
          echo "GPG_LINUX_FINGERPRINT=$GPG_LINUX_FINGERPRINT" >> $GITHUB_ENV

          sign_file() {
            local file=$1
            gpg --batch --yes --detach-sign --armor -u "$GPG_LINUX_FINGERPRINT" "$file"
            if [ $? -ne 0 ]; then
              echo "Error: Failed to sign $file"
              exit 2
            fi
            echo "$file signed successfully."
          }

          # Pack and sign final archive
          7z a -tzip metamod-bin-${{ env.APP_VERSION }}.zip addons/ example_plugin/ sdk/
          sign_file "metamod-bin-${{ env.APP_VERSION }}.zip"

      - name: Publish artifacts
        uses: softprops/action-gh-release@v2
        id: publish-job
        if: |
          startsWith(github.ref, 'refs/tags/') &&
          steps.packaging-job.outcome == 'success'
        with:
          files: |
            *.zip
            *.7z
            *.asc
